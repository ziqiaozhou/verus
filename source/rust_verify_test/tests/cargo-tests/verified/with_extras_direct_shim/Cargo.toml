[package]
name = "with_extras_direct_shim"
version = "0.1.0"
edition = "2021"

[dependencies]
vstd = { path = "../../../../../vstd" }
with_extras_lib = { path = "../with_extras_lib" }

[package.metadata.verus]
verify = true
# The shim is `pub` in the upstream crate's metadata, so a downstream crate can
# name it; calling it directly would bypass the extras' effect on verification.
test_expect_error = "is a shim generated by Verus for a function declared with extra ghost/tracked arguments"

[workspace]
